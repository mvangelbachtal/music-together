name: Build and publish Docker image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing v* tag to publish and release, if backfilling"
        required: false
        type: string

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: 0.7.9

      - name: Synchronize uv lockfile
        run: uv lock

      - name: Run pre-commit checks
        uses: pre-commit/action@v3.0.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ inputs.release_tag }},enable=${{ startsWith(inputs.release_tag, 'v') }}
            type=sha

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Make container package public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PACKAGE_NAME: ${{ github.event.repository.name }}
        run: |
          owner_type=$(gh api "/users/$OWNER" --jq '.type')
          if [ "$owner_type" = "Organization" ]; then
            package_path="/orgs/$OWNER/packages/container/$PACKAGE_NAME"
            gh api --method PATCH "$package_path" -f visibility=public
          else
            # GITHUB_TOKEN cannot manage visibility for user-owned packages;
            # the GitHub REST API only allows this via a personal access
            # token belonging to the package owner. Skip with a warning
            # instead of failing the job, and rely on manual/one-time setup.
            echo "::warning::Skipping automatic visibility update for user-owned package '$PACKAGE_NAME': GITHUB_TOKEN cannot manage visibility of packages owned by a user account. Set the package visibility manually in the package settings if needed."
          fi

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.release_tag, 'v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          generate_release_notes: true
