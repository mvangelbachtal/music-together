[project]
name = "music-together"
version = "0.0.0"
description = "A collaborative party music voting player"
requires-python = ">=3.12"
dependencies = [
	"fastapi==0.115.6",
	"uvicorn[standard]==0.34.0",
	"qrcode==8.0",
	"Pillow==11.1.0",
]

[dependency-groups]
dev = [
	"pre-commit==4.6.2",
	"commitizen==4.18.0",
	"ruff==0.16.5",
	"pytest==8.3.4",
	"httpx==0.28.1",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
version_files = ["compose.yml", "uv.lock"]
tag_format = "v$version"
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"
major_version_zero = true
