[project]
name = "music-together"
version = "0.3.0"
description = "A collaborative party music voting player"
requires-python = ">=3.12"
dependencies = [
	"fastapi==0.142.2",
	"uvicorn[standard]==0.54.0",
	"qrcode==8.2",
	"Pillow==12.3.0",
]

[dependency-groups]
dev = [
	"pre-commit==4.6.2",
	"commitizen==4.19.1",
	"ruff==0.16.10",
	"pytest==9.1.1",
	"httpx==0.28.1",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
version_files = ["compose.yml", "uv.lock"]
tag_format = "v$version"
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"
major_version_zero = true
